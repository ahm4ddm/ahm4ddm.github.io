baseURL: https://ahm4ddm.github.io
title: ~/.ahm4ddm
paginate: 5
theme: PaperMod

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

services:
  googleAnalytics:
    id: G-4C7QBNGT6Y

privacy:
  googleAnalytics:
    disable: false
    respectDoNotTrack: true

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  defaultTheme: dark
  profileMode:
    enabled: true
    title: "Hello World!"
    ShowReadingTime: true
    ShowShareButtons: true
    ShareButtons: ["linkedin", "facebook", "twitter"]
    ShowPostNavLinks: true
    ShowBreadCrumbs: true
    ShowCodeCopyButtons: false
    disableSpecial1stPost: false
    disableScrollToTop: false
    hidemeta: false
    hideSummary: false
    showtoc: false
    tocopen: false
    comments: true

  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon.ico"
    favicon32x32: "/favicon.ico"
    disableHLJS: true

  label:
    icon: "/home.png"

  # home-info mode
  homeInfoParams:
    Title: "hello world!"

  socialIcons:
    - name: "github"
      url: "https://github.com/ahm4ddm"
    - name: "linkedin"
      url: "https://id.linkedin.com/in/ahmad-dany-mirza-41b069199"

  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]
menu:
  main:
    - identifier: posts
      name: posts
      url: /posts/
      weight: 10
    - identifier: writeups
      name: writeups
      url: /writeups/
      weight: 20
    - identifier: archives
      name: archives
      url: /archives/
      weight: 30
    - identifier: about
      name: about
      url: /about/
      weight: 40

markup:
  highlight:
    # anchorLineNos: true
    codeFences: true
    guessSyntax: true
    lineNos: true
    # noClasses: false
    style: monokai
